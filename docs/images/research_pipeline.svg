<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">DBM simulation and inverse learning workflow</title><desc id="desc">Simulation produces masks. Morphology feeds Random Forest; masks feed a residual CNN; masks and morphology feed a deep hybrid. A frozen original CNN supplies the Gaussian head. Evaluation compares point accuracy and calibrated intervals.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8195b4"/></marker></defs>
