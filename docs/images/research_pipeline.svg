<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img" aria-labelledby="title desc">
  <title id="title">Connected simulation, forward prediction and inverse recovery workflow</title>
  <desc id="desc">Parameters feed a stochastic simulator. Outcomes train a forward classifier. Channel masks feed engineered features and Random Forest, or a residual CNN, to estimate the original four parameters.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8597b6"/></marker></defs>
  <rect width="1200" height="488" rx="18" fill="#10182d"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="32" y="34" fill="#a5b4cf" font-size="12" letter-spacing="2">ONE PHYSICAL MODEL / TWO LEARNING TASKS</text>
    <g fill="none" stroke="#8597b6" stroke-width="2" marker-end="url(#arrow)">
      <path d="M284 106H365"/><path d="M653 106H753"/><path d="M510 147V258H285"/>
      <path d="M950 147V198H732V242"/><path d="M950 198H1040V242"/>
      <path d="M732 322V362H871V398"/><path d="M1040 322V362H884"/>
    </g>
    <rect x="32" y="66" width="252" height="81" rx="12" fill="#20384f" stroke="#3d6b89"/>
    <text x="50" y="94" fill="#7dd3fc" font-size="17" font-weight="bold">Physical parameters</text><text x="50" y="125" fill="#e2e8f0" font-size="14">eta · E_bd0 · l_c · k</text>
    <rect x="365" y="66" width="288" height="81" rx="12" fill="#20384f" stroke="#3d6b89"/>
    <text x="384" y="94" fill="#7dd3fc" font-size="17" font-weight="bold">Stochastic DBM simulation</text><text x="384" y="125" fill="#e2e8f0" font-size="13">Laplace field + correlated disorder</text>
    <rect x="753" y="66" width="398" height="81" rx="12" fill="#322d50" stroke="#66578e"/>
    <text x="773" y="94" fill="#c4b5fd" font-size="17" font-weight="bold">Final channel masks</text><text x="773" y="125" fill="#e2e8f0" font-size="14">Spatial geometry · 128 × 128 pixels</text>
    <rect x="32" y="218" width="252" height="150" rx="12" fill="#183d36" stroke="#34685c"/>
    <text x="50" y="245" fill="#6ee7b7" font-size="12" letter-spacing="1">FORWARD TASK</text><text x="50" y="276" fill="#f8fafc" font-size="17" font-weight="bold">Outcome classification</text>
    <text x="50" y="303" fill="#c1cae0" font-size="13">Parameters → probabilities</text><text x="50" y="328" fill="#c1cae0" font-size="13">no_start / arrested / breakdown</text><text x="50" y="351" fill="#6ee7b7" font-size="13">CatBoost + reference baselines</text>
    <text x="332" y="240" fill="#a5b4cf" font-size="12">Simulated outcome labels</text>
    <text x="606" y="183" fill="#a5b4cf" font-size="12" letter-spacing="1">INVERSE TASK · TWO REPRESENTATIONS</text>
    <rect x="604" y="242" width="260" height="80" rx="12" fill="#403526" stroke="#766344"/>
    <text x="623" y="271" fill="#fcd34d" font-size="17" font-weight="bold">27 morphology features</text><text x="623" y="299" fill="#e2e8f0" font-size="14">Independent Random Forests</text>
    <rect x="906" y="242" width="246" height="80" rx="12" fill="#322d50" stroke="#66578e"/>
    <text x="924" y="271" fill="#c4b5fd" font-size="17" font-weight="bold">Full binary masks</text><text x="924" y="299" fill="#e2e8f0" font-size="14">Residual CNN · four heads</text>
    <rect x="670" y="398" width="414" height="60" rx="12" fill="#20384f" stroke="#3d6b89"/>
    <text x="690" y="435" fill="#7dd3fc" font-size="17" font-weight="bold">Recovered eta · E_bd0 · l_c · k</text>
    <text x="32" y="440" fill="#a5b4cf" font-size="12">Diagram of the implemented workflow; not a physical growth trajectory.</text>
  </g>
</svg>
