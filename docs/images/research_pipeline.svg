<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="36" y="35" font-size="13" letter-spacing="2" fill="#a5b4cf">SIMULATION → INVERSE MODELS → EVALUATION</text>
<g fill="none" stroke="#8195b4" stroke-width="2" marker-end="url(#arrow)">
<path d="M330 106H428"/><path d="M758 106H848"/>
<path d="M1010 147V181H200V233"/><path d="M600 181V233"/><path d="M1010 181V233"/>
<path d="M600 327V383"/><path d="M200 327V539"/><path d="M1010 327V539"/>
<path d="M600 475V539"/><path d="M755 282H797V517H710V539"/>
