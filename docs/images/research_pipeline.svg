<g fill="#7dd3fc" font-size="18" font-weight="bold"><text x="60" y="96">Physical parameters</text><text x="450" y="96">Stochastic DBM simulation</text><text x="870" y="96">Observed channel masks</text></g>
<g fill="#e2e8f0" font-size="14"><text x="60" y="127">η · E_bd⁽⁰⁾ · ℓc · k</text><text x="450" y="127">Laplace / SOR + spatial disorder</text><text x="870" y="127">Binary images · 128 × 128</text></g>
<text x="40" y="213" fill="#a5b4cf" font-size="12">INVERSE TASK · SHARED GROUPED SPLITS</text>
<rect x="40" y="235" width="310" height="92" rx="12" fill="#403526" stroke="#766344"/>
<rect x="445" y="235" width="310" height="92" rx="12" fill="#322d50" stroke="#66578e"/>
<rect x="850" y="235" width="310" height="92" rx="12" fill="#322d50" stroke="#66578e"/>
<text x="60" y="266" fill="#fcd34d" font-size="18" font-weight="bold">Random Forest</text><text x="60" y="292" fill="#e2e8f0" font-size="14">27 morphology features → 4 targets</text><text x="60" y="314" fill="#c1cae0" font-size="12">Tabular reference model</text>
<text x="465" y="266" fill="#c4b5fd" font-size="18" font-weight="bold">Original residual CNN</text><text x="465" y="292" fill="#e2e8f0" font-size="14">4 residual blocks → 128 features</text><text x="465" y="314" fill="#c1cae0" font-size="12">Four point-regression heads</text>
<text x="870" y="266" fill="#c4b5fd" font-size="18" font-weight="bold">Deep hybrid CNN</text><text x="870" y="292" fill="#e2e8f0" font-size="14">8 residual blocks + morphology</text><text x="870" y="314" fill="#c1cae0" font-size="12">Skip connections · joint training</text>
<text x="615" y="362" fill="#a5b4cf" font-size="12">Frozen CNN embedding</text>
<rect x="445" y="385" width="310" height="90" rx="12" fill="#183d36" stroke="#34685c"/>
<text x="465" y="416" fill="#6ee7b7" font-size="18" font-weight="bold">Gaussian inverse head</text><text x="465" y="442" fill="#e2e8f0" font-size="14">128 → 64 → means + variances</text><text x="465" y="464" fill="#c1cae0" font-size="12">Gaussian NLL · validation calibration</text>
